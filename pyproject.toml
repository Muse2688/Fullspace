[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullspace"
dynamic = ["version"]
description = "Fullspace — a 3D capability-manifold agent orchestration framework (a LangGraph superset)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fullspace" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real semantic embeddings (replaces HashEmbedder for production routing)
# embed-m2v is the lightweight option: ~30 MB static model, no torch, CPU-fast.
# (embed-st pulls in PyTorch — several GB.)
embed-m2v = ["model2vec>=0.4"]
embed-st = ["sentence-transformers>=2.2"]
embed-openai = ["openai>=1.0"]
# Scale ANN beyond brute-force numpy
# ann-usearch is incremental (add/remove without rebuild) — pair it with
# spawn-on-miss materialization; ann-faiss suits static batch workloads;
# ann-milvus/ann-neo4j serve a shared, persistent collection from a server.
ann-usearch = ["usearch>=2.0"]
ann-faiss = ["faiss-cpu>=1.7"]
ann-milvus = ["pymilvus>=2.4"]
ann-neo4j = ["neo4j>=5.20"]
# Production checkpointing backends
cp-mysql = ["PyMySQL>=1.1"]
# Non-linear 3D projection (PCAProjector is the zero-dep fallback)
proj-umap = ["umap-learn>=0.5"]
# Bidirectional interop with the LangChain/LangGraph ecosystem
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["fullspace*"]

[tool.setuptools.package-data]
fullspace = ["py.typed"]

# Single source of truth for the version: fullspace/__init__.py __version__.
[tool.setuptools.dynamic]
version = { attr = "fullspace.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
