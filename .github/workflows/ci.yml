name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # Trim the OS × version product: ubuntu covers every version, windows spot-checks the edges.
        exclude:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langgraph,dev]"
          python -m pip install faiss-cpu
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Type check
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m mypy fullspace
