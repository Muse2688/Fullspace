name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.1 && git push --tags`)
# or manually from the Actions tab. Publishes to PyPI via Trusted Publishing
# (OIDC) — no API token stored in GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Tests + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install -e ".[langgraph,dev]"
          python -m pip install faiss-cpu
      - run: python -m pytest tests/ -q
      - run: python -m mypy fullspace

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # REQUIRED for Trusted Publishing (OIDC). No password/token needed.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Optional: add `with: { attestations: true }` for signed build provenance.
